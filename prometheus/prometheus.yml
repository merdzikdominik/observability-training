global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: cardinality-demo
    static_configs:
      - targets: ["cardinality-demo:9101"]
