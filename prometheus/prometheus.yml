global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: orders-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orders-api:8080"]

  - job_name: inventory-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-api:8081"]

  - job_name: payment-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-api:8082"]

  - job_name: cardinality-demo
    static_configs:
      - targets: ["cardinality-demo:9101"]
