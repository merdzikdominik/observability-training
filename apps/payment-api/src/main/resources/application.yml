server:
  port: 8082
spring:
  application:
    name: payment-api
chaos:
  error-rate: ${PAYMENT_ERROR_RATE:0.03}
  min-delay-ms: ${PAYMENT_MIN_DELAY_MS:35}
  max-delay-ms: ${PAYMENT_MAX_DELAY_MS:220}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  file:
    name: /var/log/training/payment-api.log
  pattern:
    file: 'ts=%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} level=%p service=payment-api trace_id=%X{trace_id:-none} span_id=%X{span_id:-none} logger=%logger{24} msg="%replace(%msg){''"'',''\\"''}"%n'
    console: 'ts=%d{HH:mm:ss.SSS} level=%p service=payment-api trace_id=%X{trace_id:-none} span_id=%X{span_id:-none} msg="%msg"%n'
